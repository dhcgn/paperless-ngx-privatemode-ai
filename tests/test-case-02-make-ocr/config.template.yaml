# Template config for the tests/test-case-02-make-ocr smoke test.
# run.sh / run.ps1 substitute __PRIVATE_MODE_API_KEY__ and __IMAGEMAGICK_PATH__ with real values and
# write the result to config.generated.yaml (gitignored, since it will contain a real API key).
#
# This only exercises the managed privatemode-proxy + OCR (via --ocr-file), so the Paperless
# section below is never actually contacted.
paperless:
  api:
    base_url: "http://paperless.invalid:8000"
    token: "unused-in-smoke-test"

llm:
  api:
    base_url: "http://localhost:8098"
    endpoint: "/v1/chat/completions"
    timeout: 120
  proxy:
    api_key: "__PRIVATE_MODE_API_KEY__"
    workspace: "./privatemode-proxy-data"
  models:
    title_generation: "gpt-oss-120b"
    ocr: "kimi-latest"
  prompts:
    title_generation: "unused in smoke test - {content}"
    ocr: |
      You are an advanced OCR system. Extract ALL text content from the provided image verbatim.
      Don't say anything else, just extract the text.

processing:
  title_generation:
    truncate_characters_of_content: 2000

tools:
  imagemagick-for-windows:
    fullpath: '__IMAGEMAGICK_PATH__' # ignored on Linux, auto-detected from PATH there
